services:
  - type: web
    name: matable-ci-staging
    env: node
    plan: free
    region: frankfurt
    branch: staging/render-preprod
    autoDeploy: false
    healthCheckPath: /health
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: TRUST_PROXY_HOPS
        value: 1
      - key: APP_URL
        sync: false
      - key: ADMIN_ACCESS_KEY
        generateValue: true
      - key: VERIFICATION_ADMIN_ACCESS_KEY
        generateValue: true
      - key: AD_EVENT_SIGNING_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: matable-ci-staging-db
          property: connectionString
      - key: DEMO_MODE
        value: false
      - key: ADVERTISING_BETA_ENABLED
        value: false
      - key: VITE_WHATSAPP_ADMIN_PHONE
        value: 0102749775
databases:
  - name: matable-ci-staging-db
    plan: free
    region: frankfurt
    databaseName: matable_ci_staging
    user: matable_ci_staging
    ipAllowList: []

services:
  - type: web
    name: matable-ci
    env: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: TRUST_PROXY_HOPS
        value: 1
      - key: APP_URL
        sync: false
      - key: ADMIN_ACCESS_KEY
        generateValue: true
      - key: KYC_ENCRYPTION_KEY
        generateValue: true
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: APPLE_SERVICE_ID
        sync: false
      - key: APPLE_TEAM_ID
        sync: false
      - key: APPLE_KEY_ID
        sync: false
      - key: APPLE_PRIVATE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: VITE_WHATSAPP_ADMIN_PHONE
        value: 0102749775
      - key: WHATSAPP_CLOUD_API_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_SUBSCRIPTION_REMINDER_TEMPLATE
        sync: false
      - key: WHATSAPP_GRAPH_API_VERSION
        sync: false
      - key: WHATSAPP_TEMPLATE_LANGUAGE
        value: fr
      - key: KADEVPAY_PUBLIC_KEY
        sync: false
      - key: KADEVPAY_WEBHOOK_SECRET
        sync: false

services:
  - type: web
    name: matable-ci
    env: node
    plan: starter
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    buildCommand: npm ci --include=dev && npm run lint && npm run test:ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: TRUST_PROXY_HOPS
        value: 1
      - key: PG_POOL_MAX
        value: 10
      - key: APP_URL
        sync: false
      - key: ADMIN_ACCESS_KEY
        generateValue: true
      - key: AD_EVENT_SIGNING_SECRET
        generateValue: true
      - key: ADVERTISING_BETA_ENABLED
        value: false
      - key: VERIFICATION_ADMIN_ACCESS_KEY
        sync: false
      - key: AUTH_EMAIL_MFA_ROLLOUT_STARTED_AT
        sync: false
      - key: AUTH_EMAIL_MFA_PEPPER
        generateValue: true
      - key: AGE_VERIFICATION_SECRET
        generateValue: true
      - key: ADMIN_MFA_EMAIL
        sync: false
      - key: VERIFICATION_ADMIN_MFA_EMAIL
        sync: false
      - key: DIDIT_API_KEY
        sync: false
      - key: DIDIT_WORKFLOW_ID
        value: 17e1d727-c4db-425b-a320-eadd52105735
      - key: DIDIT_DRIVER_WORKFLOW_ID
        sync: false
      - key: DIDIT_WEBHOOK_SECRET
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: APPLE_SERVICE_ID
        sync: false
      - key: APPLE_TEAM_ID
        sync: false
      - key: APPLE_KEY_ID
        sync: false
      - key: APPLE_PRIVATE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: VITE_WHATSAPP_ADMIN_PHONE
        value: 0102749775
      - key: WHATSAPP_CLOUD_API_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_SUBSCRIPTION_REMINDER_TEMPLATE
        sync: false
      - key: WHATSAPP_GRAPH_API_VERSION
        sync: false
      - key: WHATSAPP_TEMPLATE_LANGUAGE
        value: fr
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      # Stockage des médias publics (photos produits, logos, bannières).
      # R2_PUBLIC_BASE_URL doit pointer vers le domaine public du bucket.
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      # Bucket privé séparé pour les justificatifs de vérification manuelle.
      - key: R2_PRIVATE_BUCKET
        sync: false
      - key: R2_PRIVATE_ENDPOINT
        sync: false
      - key: R2_PRIVATE_ACCESS_KEY_ID
        sync: false
      - key: R2_PRIVATE_SECRET_ACCESS_KEY
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false
      - key: GENIUSPAY_API_KEY
        sync: false
      - key: GENIUSPAY_API_SECRET
        sync: false
      - key: GENIUSPAY_WEBHOOK_SECRET
        sync: false
      - key: GENIUSPAY_API_URL
        value: https://geniuspay.ci/api/v1/merchant/payments
      # Active le parcours livreur et la facturation des frais de livraison au checkout.
      # Laisser false jusqu’à ce que les migrations 036 à 046 soient appliquées sur la base cible.
      - key: DELIVERY_OPERATIONS_ENABLED
        value: false
      - key: DELIVERY_REQUIRE_PROOF
        value: true
      - key: DELIVERY_OFFER_TTL_MINUTES
        value: 120
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:assistance@matable-ci.com

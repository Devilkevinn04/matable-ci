services:
  - type: web
    name: matable-ci
    env: node
    plan: starter
    healthCheckPath: /health
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: TRUST_PROXY_HOPS
        value: 1
      - key: APP_URL
        sync: false
      - key: ADMIN_ACCESS_KEY
        generateValue: true
      - key: AD_EVENT_SIGNING_SECRET
        generateValue: true
      - key: VERIFICATION_ADMIN_ACCESS_KEY
        sync: false
      - key: DIDIT_API_KEY
        sync: false
      - key: DIDIT_WORKFLOW_ID
        value: 17e1d727-c4db-425b-a320-eadd52105735
      - key: DIDIT_WEBHOOK_SECRET
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: APPLE_SERVICE_ID
        sync: false
      - key: APPLE_TEAM_ID
        sync: false
      - key: APPLE_KEY_ID
        sync: false
      - key: APPLE_PRIVATE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: VITE_WHATSAPP_ADMIN_PHONE
        value: 0102749775
      - key: WHATSAPP_CLOUD_API_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_SUBSCRIPTION_REMINDER_TEMPLATE
        sync: false
      - key: WHATSAPP_GRAPH_API_VERSION
        sync: false
      - key: WHATSAPP_TEMPLATE_LANGUAGE
        value: fr
      - key: GENIUSPAY_API_KEY
        sync: false
      - key: GENIUSPAY_API_SECRET
        sync: false
      - key: GENIUSPAY_WEBHOOK_SECRET
        sync: false
      - key: GENIUSPAY_API_URL
        value: https://geniuspay.ci/api/v1/merchant/payments

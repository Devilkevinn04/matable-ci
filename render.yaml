services:
  - type: web
    name: matable-ci
    env: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: TRUST_PROXY_HOPS
        value: 1
      - key: APP_URL
        sync: false
      - key: ADMIN_ACCESS_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DIDIT_ENVIRONMENT
        value: sandbox
      - key: MERCHANT_KYC_MODE
        value: disabled
      - key: DIDIT_API_KEY
        sync: false
      - key: DIDIT_WORKFLOW_ID
        sync: false
      - key: DIDIT_WEBHOOK_SECRET
        sync: false
      - key: WHATSAPP_CLOUD_ENABLED
        value: false
      - key: PAYMENT_CONTACT_PHONE
        value: +2250700000000
      - key: WHATSAPP_ADMIN_PHONE
        value: +2250700000000

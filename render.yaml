services:
  - type: web
    name: matable-ci
    env: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: TRUST_PROXY_HOPS
        value: 1
      - key: APP_URL
        sync: false
      - key: ADMIN_ACCESS_KEY
        generateValue: true
      - key: MATABLE_DB_PATH
        value: /data/matable.db
      - key: PAYSTACK_MOCK_MODE
        value: false
      - key: WHATSAPP_CLOUD_ENABLED
        value: false
      - key: PAYMENT_CONTACT_PHONE
        value: +2250700000000
      - key: WHATSAPP_ADMIN_PHONE
        value: +2250700000000
    disk:
      name: matable-data
      mountPath: /data
      sizeGB: 1

<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#176b55">
    <title>MaTable.ci hors connexion</title>
    <style>
      :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #f6f3ed; color: #25231f; }
      main { width: min(34rem, calc(100% - 2rem)); padding: 2rem; border: 1px solid #ded8ce; border-radius: 1rem; background: #fffdf9; box-shadow: 0 18px 42px rgba(37,35,31,.13); text-align: center; }
      h1 { margin: 0 0 .75rem; font-size: 1.5rem; }
      p { margin: 0; color: #6f6a61; line-height: 1.55; }
      button { margin-top: 1.5rem; border: 0; border-radius: .65rem; padding: .75rem 1rem; background: #176b55; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
      button:focus-visible { outline: 3px solid #c98b4a; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <h1>MaTable.ci est momentanément hors connexion</h1>
      <p>Reconnectez-vous à Internet puis réessayez. Les données déjà chargées restent disponibles lorsque le navigateur les a mises en cache.</p>
      <button type="button" onclick="location.reload()">Réessayer</button>
    </main>
  </body>
</html>

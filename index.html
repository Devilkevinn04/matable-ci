    <style>
      .initial-shell { display: grid; min-height: 100vh; place-items: center; background: #103E32; color: white; font-family: "DM Sans", system-ui, sans-serif; }
      .initial-shell__inner { display: grid; justify-items: center; gap: .75rem; }
      .initial-shell__mark { position: relative; display: grid; width: 96px; height: 96px; place-items: center; border-radius: 28px; background: #087F62; font: 800 4rem/1 "Bricolage Grotesque", sans-serif; animation: initial-mark 700ms cubic-bezier(.22,1,.36,1) both; }
      .initial-shell__mark::after { position: absolute; top: 8px; right: 8px; width: 16px; height: 16px; border-radius: 999px; background: #F97316; content: ""; animation: initial-dot 350ms 550ms cubic-bezier(.22,1,.36,1) both; }
      .initial-shell__name { font-size: 1.5rem; font-weight: 800; animation: initial-rise 350ms 350ms ease both; }
      .initial-shell__tagline { color: rgb(255 255 255 / 70%); font-size: .9rem; }
      @keyframes initial-mark { from { opacity: 0; transform: scale(.5) rotate(-12deg); } to { opacity: 1; transform: scale(1) rotate(0); } }
      @keyframes initial-dot { from { opacity: 0; transform: scale(.3); } 70% { transform: scale(1.2); } to { opacity: 1; transform: scale(1); } }
      @keyframes initial-rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
      @media (prefers-reduced-motion: reduce) { .initial-shell__mark, .initial-shell__mark::after, .initial-shell__name { animation: none; } }
    </style>
